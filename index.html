function adjCards(){

function openM0(k, id, pre = {}){

// ===== الحفظ =====
function save0(){
  const rec = {};
  for (const [f, l, t = 'text', o] of M[mk].f) {
    let v = $('f_' + f).value.trim();
    if (t == 'number') { v = parseFloat(v) || 0; if (v < 0) { alert('قيمة غير صحيحة: ' + l); return; } }
    else if (!o && !v) { alert('أكمل: ' + l); return; }
    if ((f == 'qty' || f == 'amount') && v <= 0) { alert('أدخل ' + l); return; }
    rec[f] = v;
  }
  if (['products','customers','suppliers'].includes(mk) && db[mk].some(x => x.id != editId && String(x.name || '').trim() == rec.name)) { alert('الاسم موجود بالفعل'); return; }
  if (mk == 'adj') { const pr = db.products.find(x => x.id == rec.product); if (!pr) { alert('أضف منتجًا أولًا'); return; } if (editId) { alert('لا يمكن تعديل الجرد، احذفه وسجّل جرد جديد'); return; } rec.before = pr.stock; rec.diff = r2(rec.counted - pr.stock); pr.stock = rec.counted; }
  let p;
  if (ST[mk]) {
    p = db.products.find(x => x.id == rec.product);
    if (!p) { alert('أضف منتجًا أولًا'); return; }
    if (ST[mk] < 0 && rec.qty > p.stock) { alert('المخزون المتاح: ' + p.stock); return; }
    rec.total = rec.qty * (mk == 'sales' || mk == 'sret' ? p.price : p.cost) - (rec.discount || 0);
    rec.cost = p.cost; rec.paid = rec.paid || 0;
    p.stock += ST[mk] * rec.qty;
  }
  if (editId) Object.assign(db[mk].find(x => x.id == editId), rec);
  else { rec.id = Date.now() + Math.random().toString(36).slice(2, 5); db[mk].push(rec); }
  store(); closeM(); render();
}
function del0(k, id){
  if (!confirm('متأكد من الحذف؟')) return;
  const r = db[k].find(x => x.id == id), p = ST[k] && db.products.find(x => x.id == r.product);
  if (p) p.stock -= ST[k] * r.qty;
  if (k == 'adj') { const pr = db.products.find(x => x.id == r.product); if (pr) { if (pr.stock - r.diff < 0) { alert('لا يمكن الحذف: سيجعل المخزون بالسالب'); return; } pr.stock = r2(pr.stock - r.diff); } }
  db[k] = db[k].filter(x => x.id != id); store(); render();
}

function stmt(k, id){ sp = {k, id}; cur = 'stmt'; menu(); render(); }

  const {k, id} = sp, c = db[k].find(x => x.id == id); if (!c) return '';
  const [a, b, pp] = BM[k], cu = k == 'customers', e = [];
  db[a].filter(x => x.party == id).forEach(x => { e.push([x.date, (cu ? 'فاتورة بيع' : 'فاتورة شراء') + ' — ' + nameOf('products', x.product) + ' × ' + x.qty, x.total]); if (x.paid > 0) e.push([x.date, 'مدفوع عند الفاتورة', -x.paid]); });
  db[b].filter(x => x.party == id).forEach(x => { e.push([x.date, 'مرتجع — ' + nameOf('products', x.product) + ' × ' + x.qty, -x.total]); if (x.paid > 0) e.push([x.date, 'مبلغ مسترد', x.paid]); });
  db[pp].filter(x => x.party == id).forEach(x => e.push([x.date, cu ? 'دفعة مستلمة' : 'دفعة مسددة', -x.amount]));
  e.sort((x, y) => x[0].localeCompare(y[0]));
  let r = +c.open || 0;
  const rows = (r ? `<tr><td></td><td>رصيد افتتاحي</td><td>${r > 0 ? money(r) : ''}</td><td>${r < 0 ? money(-r) : ''}</td><td>${money(r)}</td></tr>` : '') + e.map(([d, t, v]) => { r += v; return `<tr><td>${d}</td><td>${esc(t)}</td><td>${v > 0 ? money(v) : ''}</td><td>${v < 0 ? money(-v) : ''}</td><td>${money(r)}</td></tr>`; }).join('');
  return `<h2 class="po">${lgc(48)}${esc(db.cfg.name)}</h2><div class="bar"><h1>📄 كشف حساب: ${esc(c.name)}</h1><div><button class="btn i" onclick="print()">🖨 طباعة</button><button class="btn n" onclick="go('${k}')">رجوع</button></div></div>
  <div class="cards"><div class="card"><small>الرصيد المتبقي</small><b>${money(r)} ج.م</b></div></div>
  <div class="tw"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>مستحق (+)</th><th>مسدد (−)</th><th>الرصيد</th></tr></thead><tbody>${rows || '<tr><td colspan="5">لا توجد حركات</td></tr>'}</tbody></table></div>`;
}

// ===== الخزنة =====
function tre(){
  const mv = [];
  db.sales.forEach(x => x.paid > 0 && mv.push([x.date, 'مبيعات — ' + nameOf('customers', x.party), x.paid]));
  db.cpay.forEach(x => mv.push([x.date, 'تحصيل — ' + nameOf('customers', x.party), x.amount]));

function mergeDb(L, R){
  const out = {cfg: L.cfg, _del: {}}, DAY = 864e5 * 180, now = Date.now();
  Object.keys(M).forEach(c => {
    const dl = Object.assign({}, (R._del || {})[c]), dr = (L._del || {})[c] || {};
    Object.keys(dr).forEach(id => dl[id] = Math.max(dl[id] || 0, dr[id]));
    const mp = new Map();
    (R[c] || []).forEach(r => mp.set(r.id, {r, side: 'R'}));
    (L[c] || []).forEach(r => { const o = mp.get(r.id); if (!o || (r._m || 0) >= (o.r._m || 0)) mp.set(r.id, {r, side: 'L'}); });
    out[c] = []; out._del[c] = {};

  });

  out.products.forEach(p => {                       // المخزون = الرصيد الافتتاحي + حركات الفواتير والجرد بعد الدمج
    const src = p._side == 'L' ? Lc : Rc, s0 = r2((+p.stock || 0) - mvOf(src, p.id));

}

function gConnect(){ gSave(); if (!gs().id) return setMsg('⚠️ اكتب Client ID'); db.cfg.gsync = 1; store(); syncNow(true); }
function gOff(){ db.cfg.gsync = 0; gTok = null; store(); setMsg('تم إيقاف المزامنة (بياناتك على الجهاز زي ما هي)'); render(); }
function syncSec(){ const c = gs(); return `<h3>☁️ المزامنة بين الأجهزة (Google Drive)</h3>
  <small style="color:var(--m)">بيانات كل واحد بتتحفظ في مساحة مخفية على درايف بتاعه، والجهازين بيتزامنوا تلقائيًا لما يكون فيه إنترنت. تسجيل الدخول للبرنامج يفضل بالاسم وكلمة السر زي ما هو. اللوجو والدخول مش بيتزامنوا.</small>
  <label>الإيميل (Gmail)</label><input id="gmail" type="email" value="${esc(c.mail)}" placeholder="name@gmail.com">
  <details style="margin:6px 0"><summary style="color:var(--m);cursor:pointer">إعدادات متقدمة (Client ID)</summary><input id="gcid" value="${esc(db.cfg.gcid || '')}" placeholder="سيبه فاضي لاستخدام الافتراضي" dir="ltr"></details>
  <button class="btn p" onclick="gConnect()">🔗 ${c.on ? 'إعادة الاتصال' : 'تفعيل المزامنة'}</button><button class="btn i" onclick="gSave();syncNow(true)">🔄 مزامنة الآن</button>${c.on ? '<button class="btn n" onclick="gOff()">إيقاف</button>' : ''}
  <div id="gmsg" style="margin:6px 0;color:var(--m)">${esc(gMsg || (c.on ? (db.cfg.glast ? 'آخر مزامنة: ' + new Date(db.cfg.glast).toLocaleString('ar-EG') : 'مفعّلة') : 'غير مفعّلة'))}</div><hr>`; }
window.addEventListener('online', () => syncSoon());
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncSoon(); });
setInterval(() => syncSoon(), 120000);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}   // يمنع المتصفح من مسح البيانات تلقائيًا
snapAll();
setTimeout(() => syncSoon(), 1500);

boot();
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!window.api&&!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
</body>
